# docker-compose.mount.yml  --  MOUNT (bind-mount) delivery overlay.
# Delivery overlay for --delivery=mount. Assembled into the compose file set by
# run_agent.sh (compose_generate merges the assembled set).
# The agent works directly on the host worktree, bind-mounted at
# /home/agentuser/sandbox. No snapshot, no named sandbox volume  --  the worktree
# is the durable place (see docs/reference/execution_model.md  --  Container
# State Contract; design record devlog/discussions/20260730-design-settled-mount_model.md).
#
# Path mapping: {{WORKTREE_DIR}} (host) -> /home/agentuser/sandbox (container)
# WORKTREE_DIR resolves in session_env.sh: the invocation value, then the
# record's key, then {{SANDBOX_DIR}}/.worktree.
# The generator writes the resolved value into this mount source.

services:
  sandbox:
    volumes:
      - type: bind
        source: {{WORKTREE_DIR}}
        target: /home/agentuser/sandbox
    environment:
      - SANDBOX_TYPE=mount
      - FLATTEN={{FLATTEN}}