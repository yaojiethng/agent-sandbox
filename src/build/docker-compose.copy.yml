# docker-compose.copy.yml  --  COPY delivery overlay (default).
# Merged by src/build/compose.sh (compose_generate) when SANDBOX_TYPE=copy.
# Carries the copy-delivery wiring that bind-mount compose must never inherit:
#   - the SESSION_ID-scoped named sandbox volume (per-run state persistence,
#     volume labels for lifecycle tooling)
#
# Content transfer is host-side seeding: run_agent.sh (seed_sandbox_volume)
# extracts the seed tar into the volume via docker cp before the sandbox
# container starts. There is no snapshot mount and no snapshot env var.
#
# Volume name incorporates SESSION_ID so each session gets its own volume.
# Managed by compose lifecycle  --  preserved across `make stop` / `make start`;
# destroyed by `docker compose down -v` or pruned via `make prune --volumes`.
# Labels enable lifecycle tooling (prune, inspect, volume discovery) without
# project-name prefix parsing.

volumes:
  {{SESSION_ID}}-sandbox-data:
    labels:
      agent-sandbox.project-name: {{PROJECT_NAME}}
      agent-sandbox.sandbox-dir: ${SANDBOX_DIR}
      agent-sandbox.host-head-sha: {{HOST_HEAD_SHA}}
      agent-sandbox.host-branch: {{SANITIZED_HOST_BRANCH}}
      agent-sandbox.session-ts: {{SESSION_TS}}
      agent-sandbox.session-id: {{SESSION_ID}}

services:
  sandbox:
    volumes:
      - type: volume
        source: {{SESSION_ID}}-sandbox-data
        target: /home/agentuser/sandbox
    environment:
      - SANDBOX_TYPE=copy