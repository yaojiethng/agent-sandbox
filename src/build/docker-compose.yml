# docker-compose.yml.template
# Harness base compose template. Merged and generated by libs/compose.sh
# (compose_generate) on every run — never written to SANDBOX_DIR.
#
# {{VAR}} placeholders are substituted at generation time:
#   {{PROJECT_NAME}}       → project name
#   {{SANDBOX_IMAGE_NAME}} → capability layer image name
#   {{AGENT_IMAGE_NAME}}   → reasoning layer image name
#   {{PROVIDER_NAME}}      → provider name (e.g. hermes, opencode)
#
# ${VAR} placeholders are preserved for Docker Compose to resolve at runtime
# from the exported environment (set by start_agent.sh before compose).
#
# Workspace path variables (${SNAPSHOT_DIR}, ${CHANGES_DIR}, ${INPUT_DIR},
# ${OUTPUT_DIR}) are exported by start_agent.sh — derived from SANDBOX_DIR.
# The x-workspace anchor below documents the path mapping in one place.
#
# Container names match image names — one session per project at a time.
# Start/stop is managed by scripts/start_agent.sh via docker compose up/down.
# Do not invoke this file directly in normal operation.

# Named volume for sandbox state persistence — one per session.
# Volume name incorporates RUN_ID so each session invocation gets its own
# volume. Managed by compose lifecycle — preserved across `make stop` /
# `make start`, destroyed on `make start REFRESH=1` or `docker compose down -v`.
# Labels enable lifecycle tooling (prune, inspect, volume discovery) without
# project-name prefix parsing.
volumes:
  {{RUN_ID}}-sandbox-data:
    labels:
      agent-sandbox.project-name: {{PROJECT_NAME}}
      agent-sandbox.sandbox-dir: ${SANDBOX_DIR}
      agent-sandbox.host-head-sha: {{HOST_HEAD_SHA}}
      agent-sandbox.host-branch: {{SANITIZED_HOST_BRANCH}}
      agent-sandbox.session-ts: {{SESSION_TS}}
      agent-sandbox.run-id: {{RUN_ID}}

# Session labels — applied to ALL containers for unified lifecycle management.
x-session-labels: &session_labels
  agent-sandbox.project-name: {{PROJECT_NAME}}
  agent-sandbox.sandbox-dir: ${SANDBOX_DIR}
  agent-sandbox.host-head-sha: {{HOST_HEAD_SHA}}
  agent-sandbox.host-branch: {{SANITIZED_HOST_BRANCH}}
  agent-sandbox.session-ts: {{SESSION_TS}}
  agent-sandbox.run-id: {{RUN_ID}}

# Workspace path documentation — single source of truth for all path mappings.
# Host paths (left) are runtime ${VAR} exported by start_agent.sh from SANDBOX_DIR.
# Container paths (right) are literals fixed for the image architecture.
# When adding a new bind mount, add the mapping here and reference ${VAR} below.
# Design rationale: devlog/discussions/design_workspace_path_resolution.md
x-workspace:
  # Host → Container
  snapshot_host:   "${SNAPSHOT_DIR}"             # → "/home/agentuser/.snapshot"
  changes_host:    "${CHANGES_DIR}"              # → "/home/agentuser/workspace/session-diffs"
  input_host:      "${INPUT_DIR}"                # → "/home/agentuser/workspace/input"
  output_host:     "${OUTPUT_DIR}"               # → "/home/agentuser/workspace/output"
  provider_config_host: "${SANDBOX_DIR}/.{{PROVIDER_NAME}}" # → "/opt/provider-config"

services:
  sandbox:
    image: {{SANDBOX_IMAGE_NAME}}
    container_name: {{SANDBOX_CONTAINER_NAME}}
    labels: *session_labels
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - type: volume
        source: {{RUN_ID}}-sandbox-data
        target: /home/agentuser/sandbox
      - type: bind
        source: ${SNAPSHOT_DIR}
        target: /home/agentuser/.snapshot
        read_only: true
      - type: bind
        source: ${CHANGES_DIR}
        target: /home/agentuser/workspace/session-diffs
    environment:
      - SNAPSHOT_DIR=/home/agentuser/.snapshot
      - CHANGES_DIR=/home/agentuser/workspace/session-diffs
      - INPUT_DIR=/home/agentuser/workspace/input
      - OUTPUT_DIR=/home/agentuser/workspace/output
      - SANDBOX_DIR_NAME=sandbox
      - AUTOSAVE_INTERVAL=${AUTOSAVE_INTERVAL:-60}
      - SESSION_TS=${SESSION_TS:-}
      - SANITIZED_HOST_BRANCH=${SANITIZED_HOST_BRANCH:-}
      - HOST_HEAD_SHA=${HOST_HEAD_SHA:-}
      - RUN_ID=${RUN_ID:-}
    healthcheck:
      test: ["CMD", "test", "-d", "/home/agentuser/sandbox/.git"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: "no"

  agent:
    image: {{AGENT_IMAGE_NAME}}
    container_name: {{AGENT_CONTAINER_NAME}}
    labels: *session_labels
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      sandbox:
        condition: service_healthy
    volumes_from:
      - sandbox
    volumes:
      - type: bind
        source: ${INPUT_DIR}
        target: /home/agentuser/workspace/input
        read_only: true
      - type: bind
        source: ${OUTPUT_DIR}
        target: /home/agentuser/workspace/output
    environment:
      - INPUT_DIR=/home/agentuser/workspace/input
      - OUTPUT_DIR=/home/agentuser/workspace/output
      - CHANGES_DIR=/home/agentuser/workspace/session-diffs
      - SANDBOX_DIR_NAME=sandbox
    stdin_open: true
    tty: true
    restart: "no"
