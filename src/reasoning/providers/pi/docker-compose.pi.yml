# providers/pi/docker-compose.pi.yml
# Provider overlay  --  merged in all modes (standard, serve, dry-run).
# Sets Pi-specific environment variables and injects API keys from the host .env.

services:
  agent:
    environment:
      # Suppress Pi's version check on every startup  --  reduces noise in containers.
      - PI_SKIP_VERSION_CHECK=1
      # Provider identity  --  allows the agent to know which provider it's running.
      - PROVIDER_NAME=pi
      # API keys  --  injected from host .env; only set if non-empty.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_TOKEN=${ANTHROPIC_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      # Provider config: selective bind mounts for persistent subdirs
      # prompts/, sessions/, skills/ and the model recommendations file are RW
      # bind-mounted from the host. Config files (settings.json, auth.json,
      # models.json, AGENTS.md) are seeded from the baked image template at
      # startup  --  avoids utime/EPERM on cross-filesystem mounts (macOS
      # virtiofs, Windows 9p).
      - type: bind
        source: ${SANDBOX_DIR}/.{{PROVIDER_NAME}}/agent/prompts
        target: /home/agentuser/.pi/agent/prompts
      - type: bind
        source: ${SANDBOX_DIR}/.{{PROVIDER_NAME}}/agent/sessions
        target: /home/agentuser/.pi/agent/sessions
      - type: bind
        source: ${SANDBOX_DIR}/.{{PROVIDER_NAME}}/agent/skills
        target: /home/agentuser/.pi/agent/skills
      # Operator-owned role-to-model recommendations. Not part of the image:
      # setup.sh seeds a slug-free skeleton on the host, then the operator or
      # the setup-model-recommendations skill fills it. This is the one
      # single-file mount; a writer replaces the content in place, never with
      # mv, because mv would break the mount.
      - type: bind
        source: ${SANDBOX_DIR}/.{{PROVIDER_NAME}}/model-recommendations.md
        target: /home/agentuser/.pi/model-recommendations.md
